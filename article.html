
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#171717">

<title>Article | People's Choice Magazine</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<style>
:root {
  --pink: #e7549b;
  --dark: #171717;
  --gray: #777;
  --light: #f5f5f5;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  background: var(--light);
  color: var(--dark);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* HEADER */

header {
  background: #fff;
  padding: 24px 5%;
  text-align: center;
  border-bottom: 3px solid var(--pink);
}

.logo {
  font-family: Georgia, serif;
  font-size: clamp(26px, 5vw, 36px);
  font-weight: bold;
  letter-spacing: -0.5px;
}

.logo span {
  color: var(--pink);
}

header p {
  font-size: 14px;
  color: #555;
  margin-top: 6px;
}

/* NAVIGATION */

nav {
  background: var(--dark);
  padding: 15px;
  text-align: center;
}

nav a {
  color: #fff;
  text-decoration: none;
  font-weight: bold;
  font-size: 13px;
  letter-spacing: 0.4px;
}

/* ARTICLE CONTAINER */

.container {
  max-width: 900px;
  margin: 35px auto;
  padding: 36px;
  background: #fff;
}

/* ARTICLE CATEGORY */

.category {
  color: var(--pink);
  font-weight: bold;
  text-transform: uppercase;
  font-size: 12px;
  letter-spacing: 1px;
  margin-bottom: 12px;
}

/* HEADLINE */

h1 {
  font-family: Georgia, "Times New Roman", serif;
  font-size: clamp(32px, 5.5vw, 48px);
  line-height: 1.18;
  letter-spacing: -0.6px;
  font-weight: 700;
  margin: 10px 0 18px;
  color: #171717;
}

/* AUTHOR AND DATE */

.meta {
  color: var(--gray);
  font-size: 14px;
  line-height: 1.7;
  margin-bottom: 24px;
}

/* FEATURED IMAGE */

.featured {
  display: block;
  width: 100%;
  height: auto;
  max-height: none;
  object-fit: contain;
  object-position: center;
  margin: 0 auto 28px;
  background: #f1f1f1;
}

/* ARTICLE SUMMARY */

.excerpt {
  font-family: Arial, Helvetica, sans-serif;
  font-size: 21px;
  font-weight: bold;
  line-height: 1.75;
  color: #333;
  margin-bottom: 28px;
}

/* ARTICLE BODY */

.content {
  font-family: Arial, Helvetica, sans-serif;
  font-size: 19px;
  line-height: 1.95;
  color: #292929;
  letter-spacing: 0.1px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

/* SHARING */

.share {
  margin-top: 40px;
  padding-top: 24px;
  border-top: 1px solid #e8e8e8;
}

.share strong {
  font-size: 15px;
}

.share a {
  display: inline-block;
  background: var(--pink);
  color: white;
  padding: 13px 20px;
  margin: 12px 8px 0 0;
  text-decoration: none;
  border-radius: 5px;
  font-size: 14px;
  font-weight: bold;
  transition: opacity 0.2s;
}

.share a:hover {
  opacity: 0.85;
}

/* FOOTER */

footer {
  background: var(--dark);
  color: white;
  text-align: center;
  padding: 25px 15px;
  font-size: 12px;
}

/* ERROR / LOADING */

.error {
  padding: 40px 20px;
  text-align: center;
  font-size: 16px;
}

.loading {
  padding: 50px 20px;
  text-align: center;
  color: #777;
}

/* MOBILE */

@media (max-width: 600px) {

  header {
    padding: 20px 12px;
  }

  .container {
    margin: 10px auto;
    padding: 24px 18px;
  }

  h1 {
    font-size: 32px;
    line-height: 1.2;
    letter-spacing: -0.3px;
  }

  .meta {
    font-size: 13px;
    margin-bottom: 20px;
  }

  .featured {
    width: 100%;
    height: auto;
    margin-bottom: 24px;
  }

  .excerpt {
    font-size: 19px;
    line-height: 1.8;
  }

  .content {
    font-size: 18px;
    line-height: 1.9;
  }

  .share a {
    padding: 12px 16px;
  }
}

/* SMALL PHONES */

@media (max-width: 360px) {
  .container {
    padding: 20px 15px;
  }

  h1 {
    font-size: 28px;
  }

  .content {
    font-size: 17px;
    line-height: 1.85;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">PEOPLE'S <span>CHOICE</span></div>
  <p>Your Voice. Your Stories. Your Choice.</p>
</header>

<nav>
  <a href="index.html">← BACK TO HOMEPAGE</a>
</nav>

<main class="container" id="article">
  <p class="loading">Loading article...</p>
</main>

<footer>
  © 2026 People's Choice Magazine. All Rights Reserved.
</footer>

<script>
const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

const articleId = new URLSearchParams(
  window.location.search
).get("id");

function safe(value) {
  return String(value || "").replace(/[&<>"']/g, c => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  }[c]));
}

async function loadArticle() {
  const container = document.getElementById("article");

  if (!articleId) {
    container.innerHTML =
      '<div class="error">Article not found.</div>';
    return;
  }

  const { data, error } = await db
    .from("articles")
    .select("*")
    .eq("id", articleId)
    .eq("status", "published")
    .single();

  if (error || !data) {
    container.innerHTML =
      '<div class="error">Sorry, this article could not be found.</div>';
    return;
  }

  /* GET JOURNALIST NAME */

  let journalistName = "";

  if (data.journalist_id) {
    const { data: journalist, error: journalistError } = await db
      .from("journalists")
      .select("name")
      .eq("id", data.journalist_id)
      .maybeSingle();

    if (!journalistError && journalist) {
      journalistName = journalist.name || "";
    }
  }

  /* ARTICLE DATA */

  const title = safe(data.title);
  const excerpt = safe(data.excerpt);

  const author = safe(
    journalistName ||
    data.author ||
    "People's Choice Editorial Team"
  );

  const category = safe(data.category);
  const section = safe(data.section);
  const content = safe(data.content);
  const image = safe(data.image_url);

  const date = data.published_at
    ? new Date(data.published_at).toLocaleDateString("en-GB", {
        day: "numeric",
        month: "long",
        year: "numeric"
      })
    : "";

  const url = window.location.href;

  /* DISPLAY ARTICLE */

  container.innerHTML = `
    <div class="category">
      ${category}${section ? " · " + section : ""}
    </div>

    <h1>${title}</h1>

    <div class="meta">
      By ${author}${date ? " · " + date : ""}
    </div>

    ${
      image
      ? `
        <img
          class="featured"
          src="${image}"
          alt="${title}"
          loading="eager"
          decoding="async"
          fetchpriority="high"
        >
      `
      : ""
    }

    ${
      excerpt
      ? `<div class="excerpt">${excerpt}</div>`
      : ""
    }

    <div class="content">${content}</div>

    <div class="share">
      <strong>Share this story:</strong><br>

      <a
        target="_blank"
        rel="noopener noreferrer"
        href="https://wa.me/?text=${encodeURIComponent(title + " " + url)}"
      >
        WhatsApp
      </a>

      <a
        target="_blank"
        rel="noopener noreferrer"
        href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}"
      >
        Facebook
      </a>
    </div>
  `;

  document.title =
    (data.title || "Article") + " | People's Choice Magazine";
}

loadArticle();
</script>

</body>
</html>
